@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:300 800;font-stretch:75% 100%;font-display:swap;
  src:url(fonts/bricolage-grotesque-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:300 800;font-stretch:75% 100%;font-display:swap;
  src:url(fonts/bricolage-grotesque-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* Concept: de stalenkaart. Gipswitte ondergrond, groen-zwarte inkt, en per categorie
   een kleur die uit haar eigen projecten komt. Eén lettertype: Bricolage Grotesque. */
:root{
  --plaster:#e9ebe6;      /* ondergrond */
  --paper:#f6f7f3;        /* lichte vlakken */
  --ink:#1c231e;          /* tekst */
  --ink-2:#4a524c;        /* lopende tekst */
  --mute:#7d847e;         /* bijschriften */
  --rule:#c9cdc5;         /* lijnen */
  --moss:#56653a;         /* Kantoor: moswanden Newminds */
  --park:#8aa287;         /* Zorg: het park in het ziekenhuis */
  --lime:#dfefca;         /* Hospitality */
  --sage:#ccddd3;         /* Residentieel */
  --accent:#9c4a4a;       /* Guusjes eigen kleur: hover, focus, actief */
  --accent-deep:#813b3b;
  --accent-tint:#f1e2df;
  --f:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --wrap:1280px;
  --ease:cubic-bezier(.22,.8,.24,1);
  color-scheme:light;
}
@media (min-width:760px){:root{--gl:max(32px,env(safe-area-inset-left,0px));--gr:max(32px,env(safe-area-inset-right,0px))}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plaster);color:var(--ink);font-family:var(--f);font-optical-sizing:auto;font-size:17px;line-height:1.6;font-weight:400;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:#fff}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-left:var(--gl);padding-right:var(--gr)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
p{text-wrap:pretty}
.page{animation:in .45s var(--ease) both}
@keyframes in{from{opacity:0}to{opacity:1}}
img.fade{opacity:0;transition:opacity .6s ease}
img.fade.loaded{opacity:1}

/* links & knoppen */
.link{display:inline-flex;align-items:center;gap:.5em;font-weight:500;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.28em;transition:color .2s,text-decoration-thickness .2s}
.link:hover{color:var(--accent);text-decoration-thickness:2px}
.btn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;background:var(--ink);color:var(--paper);font-weight:500;font-size:16px;transition:background .2s}
.btn:hover{background:var(--accent)}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:2px;background:var(--c,var(--ink));box-shadow:inset 0 0 0 1px rgba(28,35,30,.14);flex:none;vertical-align:-.05em}

/* header */
.site-header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--plaster) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.site-header.scrolled{border-bottom-color:var(--rule)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo:hover{color:var(--accent)}
.logo{transition:color .2s;font-weight:650;font-size:18px;letter-spacing:-.02em;font-variation-settings:"wdth" 88;line-height:1}
.head-right{display:flex;align-items:center;gap:clamp(16px,3vw,32px)}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--rule);border-radius:999px;font-size:13px;font-weight:600}
.lang a{display:grid;place-items:center;min-width:32px;height:26px;padding:0 6px;border-radius:999px;color:var(--mute);transition:color .2s,background .2s}
.lang a:hover{color:var(--accent)}
.lang a[aria-current]{background:var(--ink);color:var(--paper)}
.nav{display:flex;gap:clamp(16px,3vw,32px);font-size:16px}
.nav a{position:relative;padding:6px 0;color:var(--ink-2);transition:color .2s}
.nav a:hover{color:var(--accent)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent);border-radius:2px}
@media (max-width:520px){.logo{font-size:15px}.logo span{display:block}.head-right{gap:12px}.nav{gap:12px;font-size:15px}.lang a{min-width:28px;padding:0 4px}}

/* home: naam */
.name-hero{padding-top:clamp(20px,4vw,48px)}
.name-hero h1{font-size:18.3vw;font-weight:700;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.035em;line-height:.86;white-space:nowrap;margin-left:-.04em}
@media (min-width:1380px){.name-hero h1{font-size:252px}}
.hero-split{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:clamp(20px,3vw,40px)}
@media (min-width:860px){.hero-split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(32px,4vw,64px);align-items:end}}
.hero-img{margin:0;border-radius:4px;overflow:hidden;background:var(--rule);aspect-ratio:3/2}
.hero-img img{width:100%;height:100%;object-fit:cover}
.name-hero .pf{display:block;font-size:clamp(1.05rem,1.6vw,1.35rem);font-weight:500;font-variation-settings:"wdth" 100,"opsz" 14;letter-spacing:-.01em;line-height:1;margin:0 0 .5em .06em;white-space:normal}
.services{list-style:none;margin:0;padding:0;font-size:clamp(1.6rem,3.2vw,2.75rem);font-weight:500;line-height:1.08;letter-spacing:-.025em;font-variation-settings:"wdth" 82}
.services li{padding:.18em 0;border-bottom:1px solid var(--rule)}
.services li:first-child{border-top:1px solid var(--ink)}
.hero-cap{margin:14px 0 0;font-size:14px;color:var(--mute)}
.hero-cap a:hover{color:var(--accent)}

.statement{display:flex;justify-content:center;margin-top:clamp(64px,9vw,128px)}
.statement p{margin:0;font-size:clamp(1.6rem,3.3vw,2.9rem);font-weight:400;font-variation-settings:"opsz" 17,"wdth" 100;letter-spacing:-.01em;line-height:1.3;max-width:30ch;text-align:center;text-wrap:balance}
.statement strong{font-weight:650}

/* stalenkaart */
.deck-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:clamp(72px,10vw,140px) 0 20px}
.deck-head h2{font-size:clamp(1.25rem,1.8vw,1.5rem);font-weight:600}
.deck{display:flex;gap:10px;height:clamp(420px,46vw,600px)}
.swatch{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;border-radius:6px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 1px rgba(28,35,30,.06);transition:flex-grow .7s var(--ease)}
.swatch .chip{position:relative;flex:1;background:var(--c);overflow:hidden}
.swatch .chip::before{content:"";position:absolute;inset:0 0 auto 0;height:14px;background:var(--c);z-index:1}
.swatch .chip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 1.2s var(--ease),filter .5s ease}
.swatch .label{display:flex;flex-direction:column;justify-content:end;gap:4px;padding:14px 16px 16px;min-height:104px}
.swatch h3{font-size:clamp(1.05rem,1.6vw,1.45rem);font-weight:600;letter-spacing:-.02em;overflow-wrap:break-word}
.swatch .count{font-size:14px;color:var(--mute);white-space:nowrap}
.deck:hover .swatch{flex-grow:1}
.deck .swatch:hover,.deck .swatch:focus-visible{flex-grow:2.2}
.swatch:hover .chip img,.swatch:focus-visible .chip img{transform:none}
.deck:hover .swatch:not(:hover) .chip img{filter:saturate(.55) brightness(1.04)}
.swatch h3,.swatch .count{transition:color .3s}
.swatch:hover h3,.swatch:focus-visible h3{color:var(--accent)}
@media (max-width:760px),(hover:none){
  .deck{display:grid;grid-template-columns:1fr 1fr;height:auto;gap:10px}
  .swatch .chip{aspect-ratio:3/4;flex:none}
  .swatch .chip img{transform:none}
  .swatch .label{min-height:0;padding:12px 12px 14px;gap:2px}
  .swatch .count{font-size:13px}
  .deck:hover .swatch,.deck .swatch:hover{flex-grow:1}
}
.deck-foot{margin-top:24px}
.deck-count{color:var(--mute);font-size:15px}

/* koppen subpagina's */
.head{padding-top:clamp(32px,6vw,80px)}
.head h1{font-size:clamp(3rem,9vw,8.5rem);font-weight:700;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.035em;line-height:.88}
.head .intro{margin:clamp(20px,3vw,32px) 0 0;max-width:60ch;font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.65;color:var(--ink-2)}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--mute);margin:0 0 18px}
.crumbs a{text-decoration:underline;text-underline-offset:.25em;text-decoration-color:var(--rule)}
.crumbs a:hover{color:var(--accent)}
.crumbs span[aria-hidden]{opacity:.5}

/* filter als stalen */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:clamp(36px,5vw,56px) calc(var(--gl) * -1) 0;padding:2px var(--gl)}
.filters::-webkit-scrollbar{display:none}
.filters a,.filters button{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:transparent;font-size:15px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.filters a:hover,.filters button:hover{border-color:var(--accent);color:var(--accent)}
.filters [aria-pressed="true"]:hover,.filters [aria-current="page"]:hover{color:var(--paper)}
.filters [aria-pressed="true"],.filters [aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filters .n{font-size:13px;opacity:.55;font-variant-numeric:tabular-nums}

/* projectindex */
.index{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--ink)}
.index li{border-bottom:1px solid var(--rule)}
.index a{display:grid;grid-template-columns:clamp(96px,14vw,184px) minmax(0,1fr);gap:clamp(14px,2.4vw,32px);align-items:center;padding:clamp(12px,1.4vw,18px) 0}
.index .th{border-radius:3px;overflow:hidden;aspect-ratio:4/3;background:var(--rule)}
.index .th img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.index .txt{display:grid;gap:6px;min-width:0}
.index h3{font-size:clamp(1.2rem,2.6vw,2.2rem);font-weight:550;letter-spacing:-.025em;line-height:1.08;font-variation-settings:"wdth" 88;transition:transform .5s var(--ease),color .3s}
.index .facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14.5px;color:var(--mute)}
.index .facts span:first-child{display:inline-flex;align-items:center;gap:7px;color:var(--ink-2)}
.index a:hover h3{transform:translateX(6px);color:var(--accent)}
.index a:hover .th img{transform:scale(1.05)}
@media (min-width:900px){
  .index a{grid-template-columns:184px minmax(0,1fr) 190px 170px 56px}
  .index .txt{display:contents}
  .index .facts{display:contents}
  .index .facts span{font-size:15px}
  .index .facts span:last-child{text-align:right;font-variant-numeric:tabular-nums}
}
.back-row{margin-top:clamp(40px,5vw,64px)}

/* categoriepagina: kleurband */
.band{background:var(--c);color:var(--on,var(--ink))}
.band .wrap{padding-top:clamp(32px,6vw,80px);padding-bottom:clamp(36px,5vw,64px)}
.band .crumbs{color:inherit;opacity:.75}
.band .crumbs a{text-decoration-color:currentColor}
.band h1{font-size:clamp(3rem,9vw,8.5rem);font-weight:700;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.035em;line-height:.88}
.band .intro{margin:clamp(20px,3vw,32px) 0 0;max-width:60ch;font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.65}
.band .filters{margin-top:clamp(28px,4vw,44px)}
.band .filters a{border-color:color-mix(in srgb,currentColor 35%,transparent);color:inherit}
.band .filters [aria-current="page"]{background:var(--on,var(--ink));color:var(--c);border-color:transparent}
.cat-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(32px,4vw,48px) clamp(14px,2vw,24px);margin-top:clamp(40px,5vw,64px)}
@media (max-width:700px){.cat-list{grid-template-columns:1fr}}
.cat-list.solo{grid-template-columns:1fr}
.work{display:grid;gap:14px}
.work .ph{border-radius:4px;overflow:hidden;aspect-ratio:3/2;background:var(--rule)}
.work .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.work:hover .ph img{transform:scale(1.035)}
.work h2{transition:color .3s}
.work:hover h2{color:var(--accent)}
.work h2{font-size:clamp(1.4rem,2.6vw,2.2rem);font-weight:550;font-variation-settings:"wdth" 88;letter-spacing:-.025em}
.work p{margin:4px 0 0;color:var(--mute);font-size:15px}

/* projectpagina */
.p-top{padding-top:clamp(24px,4vw,48px)}
.p-top h1{font-size:clamp(2.6rem,7.4vw,7rem);font-weight:700;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.035em;line-height:.9}
.p-cover{margin:clamp(24px,3vw,40px) 0 0;max-height:88vh;aspect-ratio:16/9;overflow:hidden;background:var(--rule);cursor:zoom-in}
.p-cover img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){.p-cover{aspect-ratio:4/3}}
.p-lead{margin:clamp(48px,7vw,96px) 0 0;max-width:30ch;font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.15;letter-spacing:-.025em;font-weight:450}
.p-section{margin-top:clamp(56px,8vw,112px)}
.p-section > h2{font-size:clamp(1.8rem,4vw,3.4rem);font-weight:650;font-variation-settings:"wdth" 80,"opsz" 96;letter-spacing:-.03em;margin-bottom:clamp(20px,3vw,36px);padding-top:clamp(20px,2vw,28px);border-top:1px solid var(--ink)}
.p-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:start}
@media (min-width:920px){.p-grid{grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}}
.p-text{margin:0;max-width:62ch;font-size:clamp(1.08rem,1.4vw,1.25rem);line-height:1.7;color:var(--ink-2)}
.spec{margin:0;border-top:1px solid var(--ink)}
.spec div{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:15px}
.spec dt{color:var(--mute)}
.spec dd{margin:0;font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:6px 14px;list-style:none;margin:0;padding:0}
.tools li{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500}
.tools img{width:26px;height:26px;border-radius:50%}

.gallery{--gg:clamp(10px,1.5vw,20px);display:grid;gap:var(--gg);margin-top:clamp(40px,5vw,64px)}
.g-row{display:flex;gap:var(--gg);align-items:flex-start}
.g-row img{flex:var(--r) 1 0%;width:0;min-width:0;height:auto;aspect-ratio:var(--r);object-fit:cover;border-radius:3px;background:var(--paper);cursor:zoom-in}
.docs-block{margin-top:clamp(48px,6vw,80px);display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:920px){.docs-block{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}}
.docs-block h3{font-size:clamp(1.2rem,1.8vw,1.5rem);font-weight:600;max-width:16ch}
.docs{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.docs a{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--rule);font-size:16px;font-weight:500}
.docs .size{font-size:14px;color:var(--mute);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.docs .open{font-size:14px;text-decoration:underline;text-underline-offset:.25em;text-decoration-color:var(--rule)}
.docs a:hover .open{text-decoration-color:currentColor}
.docs a{transition:color .2s,background .3s}
.docs a:hover{color:var(--accent);background:linear-gradient(90deg,var(--accent-tint),transparent 75%)}

.p-next{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:clamp(72px,10vw,140px);padding-top:20px;border-top:1px solid var(--ink)}
.p-next .cap{font-size:15px;color:var(--mute);margin:0}
.p-next a.next{display:grid;grid-template-columns:minmax(0,1fr) clamp(120px,24vw,320px);gap:clamp(16px,3vw,40px);align-items:end}
.p-next a.next strong{font-size:clamp(2rem,6vw,5.2rem);font-weight:700;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.035em;line-height:.9;transition:color .3s}
.p-next a.next:hover strong{color:var(--accent)}
.p-next a.next .ph{border-radius:3px;overflow:hidden;aspect-ratio:4/3;background:var(--rule)}
.p-next a.next img{width:100%;height:100%;object-fit:cover}

/* over */
.about-top{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(28px,4vw,56px);padding-top:clamp(32px,6vw,80px)}
.about-top h1{font-size:clamp(2.6rem,10.2vw,9.6rem);font-weight:700;font-variation-settings:"wdth" 75,"opsz" 96;letter-spacing:-.035em;line-height:.86;overflow-wrap:anywhere;hyphens:manual}
.about-top .based{margin:12px 0 0;font-size:clamp(1.1rem,1.8vw,1.5rem);color:var(--ink-2)}
.about-body{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:start}
@media (min-width:880px){.about-body{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}

const ratioOf = id => Math.min(2, Math.max(.75, RATIO[hash(id)] || 1.5));
const GRID = [  /* [minimale schermbreedte, ritme: aantal foto's per rij] */
  [900, [3, 2]], [600, [2]], [0, [1, 2]]
];
function rowsFor(list) {
  const [, rhythm] = GRID.find(([w]) => innerWidth >= w);
  const rows = [];
  for (let i = 0, r = 0; i < list.length; r++) {
    const n = rhythm[r % rhythm.length];
    rows.push(list.slice(i, i + n)); i += n;
  }
  /* een losse laatste foto bij de rij ervoor zetten, zodat hij niet enorm wordt */
  const max = Math.max(...rhythm), last = rows[rows.length - 1], prev = rows[rows.length - 2];
  if (prev && last.length === 1 && max > 2) {
    if (prev.length < max) prev.push(...rows.pop()); else last.unshift(prev.pop());
  }
  return rows;
}
function galleryRows(list) {
  return rowsFor(list).map(row => {
    const w = row.length === 1 ? 2400 : 1400;
    return `<div class="g-row">${row.map(id => `<img src="${img(id, w)}" alt="" loading="lazy" data-full="${img(id, 2400)}" style="--r:${ratioOf(id)}">`).join("")}</div>`;
  }).join("");
}
const gallery = list => `<div class="gallery" data-ids="${list.join(" ")}">${galleryRows(list)}</div>`;
let gridStep = GRID.findIndex(([w]) => innerWidth >= w);
addEventListener("resize", () => {
  const step = GRID.findIndex(([w]) => innerWidth >= w);
  if (step === gridStep) return;
  gridStep = step;
  document.querySelectorAll(".gallery[data-ids]").forEach(g => { g.innerHTML = galleryRows(g.dataset.ids.split(" ")); });
});

/* ---------- router: #projects (NL) en #en/projects (EN) ---------- */
function parse(h) {
  let s = (h || "").replace(/^#\/?/, "");
  let lang = "nl";
  if (s === "en" || s.startsWith("en/")) { lang = "en"; s = s.slice(3); }
  return { lang, key: s || "home" };
}
/* eigen sleutels alleen, zodat #constructor of #__proto__ niet als pagina telt */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
const known = k => ["home", "projects", "about", "contact"].includes(k) || own(CATEGORIES, k) || own(PROJECTS, k);
function render() {
  const r = parse(location.hash);
  L = r.lang;
  try { localStorage.setItem("lang", L); } catch (e) {}
  const key = known(r.key) ? r.key : "home", t = T();
  const app = document.getElementById("app");
  let html, title, nav = "";
  if (key === "projects") { html = pageProjects(); nav = "projects"; }
  else if (key === "about") { html = pageAbout(); nav = "about"; }
  else if (key === "contact") { html = pageContact(); nav = "contact"; }
  else if (own(CATEGORIES, key)) { html = pageCategory(key); title = CAT(key).title; nav = "projects"; }
  else if (own(PROJECTS, key)) { html = pageProject(key); title = plain(P(key).title); nav = "projects"; }
  else { html = pageHome(); }
  app.innerHTML = html;
  app.querySelectorAll("img").forEach(i => {
    if (i.complete && i.naturalWidth) return;
    i.classList.add("fade");
    const done = () => i.classList.add("loaded");
    i.addEventListener("load", done, { once: true }); i.addEventListener("error", done, { once: true });
  });

  /* vaste delen: header, footer, lightbox */
  document.documentElement.lang = L;
  document.querySelectorAll("[data-route]").forEach(a => { a.href = href(a.dataset.route); });
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll("[data-i18n-label]").forEach(el => el.setAttribute("aria-label", t[el.dataset.i18nLabel]));
  document.getElementById("lightbox").setAttribute("aria-label", t.image);
  const nl = document.getElementById("lang-nl"), en = document.getElementById("lang-en");
  nl.href = `#${key}`; en.href = `#en/${key}`;
  nl.toggleAttribute("aria-current", L === "nl"); en.toggleAttribute("aria-current", L === "en");
  document.querySelectorAll("[data-nav]").forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  document.title = key === "home" ? t.home : `${title || t[key] || ""} | Guusje Rozendom`;
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* eerste bezoek zonder taal in de link: eerder gekozen taal onthouden */
if (!location.hash) {
  try { if (localStorage.getItem("lang") === "en") history.replaceState(null, "", "#en/home"); } catch (e) {}
}
window.addEventListener("hashchange", render);
render();
document.getElementById("year").textContent = new Date().getFullYear();

const header = document.getElementById("header");
const onScroll = () => header.classList.toggle("scrolled", scrollY > 8);
addEventListener("scroll", onScroll, { passive: true }); onScroll();

/* link naar de pagina waar je al bent (bijv. Portfolio op home): naar boven scrollen */
document.addEventListener("click", e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const target = a.hasAttribute("data-top") ? null : parse(a.getAttribute("href")), cur = parse(location.hash);
  if (!target || (target.key === cur.key && target.lang === cur.lang)) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
  }
});

/* ---------- telefoonnummer pas tonen na een klik ----------
   Het nummer staat in stukjes en achterstevoren in de code, zodat scrapers het niet herkennen. */
const PHONE = ["2435", "7223", "61", "3+"];
document.addEventListener("click", e => {
  const b = e.target.closest("[data-phone]"); if (!b) return;
  const raw = PHONE.join("").split("").reverse().join("");
  const a = document.createElement("a");
  a.href = "tel:" + raw;
  a.className = b.className.replace(/\b(reveal|reveal-link)\b/g, "").trim();
  a.textContent = b.dataset.phone === "spaced"
    ? raw.replace(/^(\+\d\d)(\d)(\d\d)(\d\d)(\d\d)(\d\d)$/, "$1 $2 $3 $4 $5 $6")
    : raw.replace(/^(\+\d\d)(\d)(\d+)$/, "$1 $2 $3");
  b.replaceWith(a); a.focus();
});

/* ---------- filter, kopiëren ---------- */
let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = Object.assign(document.createElement("div"), { className: "toast", textContent: msg });
  el.setAttribute("role", "status");
  document.body.append(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 1800);
}
document.getElementById("app").addEventListener("click", e => {
  const f = e.target.closest("[data-filter]");
  if (f) {
    const v = f.dataset.filter;
    f.parentElement.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", b === f));
    document.querySelectorAll("#index li").forEach(li => { li.hidden = v !== "all" && li.dataset.cat !== v; });
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) navigator.clipboard?.writeText(c.dataset.copy).then(() => toast(T().copied), () => toast(c.dataset.copy));
});

/* ---------- lightbox ---------- */
const lb = document.getElementById("lightbox"), lbImg = document.getElementById("lb-img"), lbCount = document.getElementById("lb-count");
let set = [], idx = 0, lastFocus;
const show = i => { idx = (i + set.length) % set.length; lbImg.src = set[idx]; lbCount.textContent = `${idx + 1} / ${set.length}`; };
document.getElementById("app").addEventListener("click", e => {
  const el = e.target.closest(".gallery img, .p-cover"); if (!el) return;
  set = [...new Set([...document.querySelectorAll(".p-cover, .gallery img")].map(x => x.dataset.full))];
  lastFocus = document.activeElement;
  show(set.indexOf(el.dataset.full)); lb.hidden = false; document.body.style.overflow = "hidden";
  document.getElementById("lb-close").focus();
});
const close = () => { lb.hidden = true; lbImg.removeAttribute("src"); document.body.style.overflow = ""; lastFocus?.focus?.(); };
document.getElementById("lb-close").onclick = close;
document.getElementById("lb-prev").onclick = () => show(idx - 1);
document.getElementById("lb-next").onclick = () => show(idx + 1);
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb-stage")) close(); });
let tx = null;
lb.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", e => {
  if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 50) show(idx + (dx < 0 ? 1 : -1));
});
document.addEventListener("keydown", e => {
  if (lb.hidden) return;
  if (e.key === "Escape") close();
  if (e.key === "ArrowLeft") show(idx - 1);
  if (e.key === "ArrowRight") show(idx + 1);
});
</script>
